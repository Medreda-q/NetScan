<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Shield / Accent Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Radar Grid Rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="26" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35" />
  <circle cx="50" cy="50" r="14" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />
  <line x1="12" y1="50" x2="88" y2="50" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Radar Sweep Sector / Cone -->
  <path d="M50 50 L78 28 A38 38 0 0 0 50 12 Z" fill="url(#radarSweep)" opacity="0.4" />

  <!-- Central Shield Silhouette -->
  <path d="M50 24 L68 31 C68 49 57 65 50 72 C43 65 32 49 32 31 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Pulse / Network Anomaly Nodes inside Shield -->
  <!-- Center Node -->
  <circle cx="50" cy="46" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- Anomaly Alert Node (Red/Orange outlier) -->
  <circle cx="60" cy="38" r="2.5" fill="#f43f5e" filter="url(#glow)" />
  <!-- Normal Nodes -->
  <circle cx="40" cy="40" r="2.2" fill="#818cf8" />
  <circle cx="44" cy="55" r="2.2" fill="#818cf8" />
  <circle cx="56" cy="54" r="2.2" fill="#818cf8" />

  <!-- Connection Links / Edges -->
  <path d="M50 46 L60 38 M50 46 L40 40 M50 46 L44 55 M50 46 L56 54 M40 40 L44 55 M56 54 L60 38" 
        stroke="#38bdf8" 
        stroke-width="1.2" 
        stroke-opacity="0.6" 
        stroke-linecap="round" />

  <!-- Small anomaly alert pulse ring -->
  <circle cx="60" cy="38" r="4.5" fill="none" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="1.5 1.5" />
</svg>
